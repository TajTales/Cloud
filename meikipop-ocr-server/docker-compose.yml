version: "3.8"

services:
  ocr-server:
    build: .
    container_name: meikipop-ocr-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["--host", "0.0.0.0", "--port", "8080", "--provider", "glensv2"]

  # Optional Nginx reverse proxy (handles port 80, large payloads & WebSocket upgrade)
  nginx:
    image: nginx:alpine
    container_name: meikipop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443" # Uncomment if using SSL certificates
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro # Uncomment for SSL certs
    depends_on:
      - ocr-server

