  description: DRAFT ONLY. No CT-01 decision has three-member approval. Candidate HTTP/S3 D05 branch; all application
    endpoints are unimplemented in this workspace. Existing raw /ocr and /ws are documented separately, not
    moved under /api/v1. Credentials in examples are redacted non-usable placeholders, not tokens issued by
    an API.
servers:
- url: https://api.example.invalid/api/v1
  description: Reserved invalid example host; NOT a deployment.
security:
- CognitoAccessToken: []
tags:
- name: Profile
- name: Solo OCR
- name: Lexicon
