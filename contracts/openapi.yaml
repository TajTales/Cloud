      - D04
      - D08
      - D14
      - D15
      x-permission: Authenticated caller only; user_id/roles derived from verified identity.
      x-owner: Hoàng Bảo API; Đức consumer; Bảo Anh worker/lexicon where relevant
      responses:
        '200':
          description: SYNTHETIC success example; see schema and DRAFT dependencies.
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              example: req-synthetic-001
            X-Data-Mode:
