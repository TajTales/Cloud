      Event_request_failed:
        $ref: '#/components/messages/Event_request_failed'
      Event_app_pong:
        $ref: '#/components/messages/Event_app_pong'
operations:
  receiveClientCommand:
    action: receive
    channel:
      $ref: '#/channels/realtime'
    messages:
    - $ref: '#/channels/realtime/messages/Command_session_subscribe'
    - $ref: '#/channels/realtime/messages/Command_session_unsubscribe'
    - $ref: '#/channels/realtime/messages/Command_room_subscribe'
    - $ref: '#/channels/realtime/messages/Command_room_unsubscribe'
    - $ref: '#/channels/realtime/messages/Command_app_ping'
    summary: Server receives validated authorized commands.
  sendServerEvent:
    action: send
    channel:
      $ref: '#/channels/realtime'
    messages:
    - $ref: '#/channels/realtime/messages/Event_session_subscribed'
    - $ref: '#/channels/realtime/messages/Event_session_unsubscribed'
    - $ref: '#/channels/realtime/messages/Event_room_snapshot'
