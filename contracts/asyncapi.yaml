    - $ref: '#/channels/realtime/messages/Event_ocr_result_available'
    - $ref: '#/channels/realtime/messages/Event_ocr_job_failed'
    - $ref: '#/channels/realtime/messages/Event_session_source_changed'
    - $ref: '#/channels/realtime/messages/Event_session_ended'
