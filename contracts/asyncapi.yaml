    - $ref: '#/channels/realtime/messages/Event_room_closed'
    - $ref: '#/channels/realtime/messages/Event_request_failed'
    - $ref: '#/channels/realtime/messages/Event_app_pong'
    summary: Server emits snapshots, manifests, errors and lifecycle events.
