asyncapi: 3.0.0
info:
  title: LinguaLive Application Realtime — DRAFT
  version: 0.1.0-draft.1
  description: 'Server/application viewpoint: receive commands, send events. Candidate D05 HTTP/S3 branch.
    NO images or chat on this socket. One-use ticket from authenticated POST /api/v1/realtime/tickets, URL
    query redacted. Protocol 1.0 is separate from contract package prerelease.'
defaultContentType: application/json
servers:
  draft:
    host: realtime.example.invalid
    protocol: wss
    description: Reserved invalid host, not a deployed Gateway.
    security:
    - $ref: '#/components/securitySchemes/RealtimeTicket'
channels:
  realtime:
    address: /realtime
    description: Single socket channel, action/type discriminates messages. Reconnect with fresh ticket, subscribe
      again, resync via HTTP bounded through_seq.
    servers:
    - $ref: '#/servers/draft'
    messages:
      Command_session_subscribe:
        $ref: '#/components/messages/Command_session_subscribe'
      Command_session_unsubscribe:
        $ref: '#/components/messages/Command_session_unsubscribe'
      Command_room_subscribe:
        $ref: '#/components/messages/Command_room_subscribe'
      Command_room_unsubscribe:
        $ref: '#/components/messages/Command_room_unsubscribe'
      Command_app_ping:
        $ref: '#/components/messages/Command_app_ping'
      Event_session_subscribed:
        $ref: '#/components/messages/Event_session_subscribed'
      Event_session_unsubscribed:
        $ref: '#/components/messages/Event_session_unsubscribed'
      Event_room_snapshot:
        $ref: '#/components/messages/Event_room_snapshot'
      Event_room_unsubscribed:
        $ref: '#/components/messages/Event_room_unsubscribed'
